name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up venv
        run: make setup

      - name: Check Python syntax
        run: .venv/bin/python -m compileall custom_components/norman_shutters -q

      - name: Lint with ruff
        run: make lint format-check

      - name: Run tests
        run: make test
